name: Hent jernbanenett

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/hent_jernbane.py
      - .github/workflows/jernbane.yml
  schedule:
    - cron: "17 3 1 * *"   # den 1. hver måned

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent og forenkle Banelenke fra Geonorge
        run: python .github/scripts/hent_jernbane.py jernbane.json
      - name: Lagre endringer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add jernbane.json
          if git diff --cached --quiet; then echo "Ingen endringer"; exit 0; fi
          git commit -m "Oppdater jernbanenett fra Bane NOR"
          git push
